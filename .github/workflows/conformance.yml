# The contract's conformance suite against the released image: pulls the image, applies its migrate step to a
# throwaway PostgreSQL, starts it, and runs the Client side of Ai.Tests.Conformance against it (CONFORMANCE_BASE_URL). Runs after each
# image publish on main, nightly and on dispatch. It cannot block a publish; the descriptor's verify dev check is the
# promotion gate.
name: conformance

on:
  workflow_run:
    workflows: [publish-docker-image]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: The image tag to test
        required: false
        default: latest

permissions:
  contents: read
  packages: read

concurrency:
  group: conformance
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: engineering/codebase/ai.backend-services/global.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The image's own migrate step first, as a deploy runs it; Development mode then skips the HTTPS redirect a
      # production host applies behind its ingress.
      - name: Start the released image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/ai:$TAG"
          connection="Host=database;Database=ai;Username=ai;Password=ai"
          docker network create conformance
          docker run --detach --name database --network conformance \
            --env POSTGRES_DB=ai --env POSTGRES_USER=ai --env POSTGRES_PASSWORD=ai postgres:18-alpine
          for _ in $(seq 1 30); do
            docker exec database pg_isready --host 127.0.0.1 -U ai -d ai >/dev/null 2>&1 && break
            sleep 2
          done
          docker run --rm --network conformance --env DB_CONNECTION="$connection" "$image" migrate
          docker run --detach --name ai --network conformance --publish 127.0.0.1:8080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Development --env DB_CONNECTION="$connection" "$image"
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health >/dev/null && exit 0
            sleep 2
          done
          echo "::error::$image never reported healthy"
          exit 1

      # The Client package has no HTTP broker yet (backlog: HTTP API and Client brokers), so the image is checked
      # through its status endpoint and an operator verb over the migrated database; the client conformance suite
      # returns here when the brokers land.
      - name: Check the image's status and verbs
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/system/status
          docker run --rm --network conformance --env DB_CONNECTION="Host=database;Database=ai;Username=ai;Password=ai" \
            "ghcr.io/${GITHUB_REPOSITORY,,}/ai:$TAG" ai usecase list

      - name: Service log
        if: failure()
        run: docker logs ai
